<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nudge - Register</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../css/form.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="icon" type="image/svg+xml" href="../Assets/logo.svg" />
</head>
<body>

<main class="auth-container">
    <header class="auth-header">
        <div class="auth-logo">
            <img src="../Assets/logo.svg" alt="Nudge Logo" class="auth-logo-img">
            <h1 class="auth-title">Nudge</h1>
        </div>
        <p class="auth-subtitle">Create an account to start tracking your daily tasks effortlessly.</p>
    </header>


    <form class="auth-form" id="registerForm">

        <div class="form-group">
            <label for="fullName" class="form-label">Full Name</label>
            <div class="input-wrapper">
                <span class="material-symbols-outlined input-icon">person</span>
                <input
                        type="text"
                        id="fullName"
                        class="form-input"
                        placeholder="John Doe"
                        required
                        autocomplete="name"
                >
            </div>
        </div>


        <div class="form-group">
            <label for="email" class="form-label">Email Address</label>
            <div class="input-wrapper">
                <span class="material-symbols-outlined input-icon">mail</span>
                <input
                        type="email"
                        id="email"
                        class="form-input"
                        placeholder="name@example.com"
                        required
                        autocomplete="email"
                >
            </div>
        </div>





        <button type="submit" class="btn-submit">
            <span>Create Account</span>
            <span class="material-symbols-outlined">arrow_forward</span>
        </button>
    </form>


</main>
<script src="../js/form.js"></script>
</body>
</html>
