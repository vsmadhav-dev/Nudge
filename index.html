<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nudge</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
   <link rel="icon" type="image/svg+xml" href="Assets/logo.svg" />
</head>
<body>

<main class="app-container">
    <header class="app-header">
        <div class="app-header__content">
            <div class="app-header__logo">
            <div class="heading-container">
        <h1 class="heading">Nudge</h1>

            </div>
            <div class="img-container">
                <img class="img" src="Assets/logo.svg" alt="Nudge">
            </div>
            </div>
        <p class="heading-description">A Todo List App which helps you track your everyday tasks</p>
        </div>

        <div class="time-container">
            <p class="time" id="time"></p>
        </div>
    </header>


    <form class="todo-form" id="todoForm">
        <input
                type="text"
                id="todo-input"
                class="todo-input"
                placeholder="What needs to be done?"
                required
        >
        <button type="submit" class="btn-add">Add Task</button>
    </form>
    <form class="todo-form2 hide" id="addTaskForm">

        <div class="form-group">
            <label for="taskName">Task Name</label>
            <input
                    type="text"
                    id="taskName"
                    class="todo-input"
                    placeholder="Enter task name..."
                    required
            >
        </div>

        <!-- Priority Selector -->
        <div class="form-group">
            <label for="taskPriority">Priority</label>
            <select id="taskPriority" class="form-select">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
            </select>
        </div>

        <!-- Label / Tag Input -->
        <div class="form-group">
            <label for="taskTag">Label</label>
            <input
                    type="text"
                    id="taskTag"
                    class="todo-input"
                    placeholder="e.g., Work, Personal, Urgent"
            >
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-add">Add Task</button>
    </form>
    <div class="filter">
        <div class="filter-input">
<p class="filter-task">Filter Tasks By</p>
            <span class="material-symbols-outlined">
filter_list
</span>
        </div>

        <select class="filter-select">
            <option value="all">All</option>
            <option value="completed">Completed</option>
            <option value="uncompleted">Uncompleted</option>
        </select>

    </div>

    <ul id="todoList" class="todo-list">

        <li class="todo-card priority-high">
            <label class="custom-checkbox">
                <input type="checkbox">
                <span class="checkmark"></span>
            </label>
            <div class="todo-content">
                <span class="todo-title">Finalize Q3 Marketing Report</span>
                <div class="todo-meta">
                    <span class="tag tag-high">Urgent</span>
                    <span class="todo-time">09:00 AM</span>
                </div>
            </div>
            <div class="todo-actions">

                <button type="button" class="btn-icon btn-ai" title="Get AI Suggestions">
                    <span class="material-symbols-outlined">auto_awesome</span>
                </button>


                <button type="button" class="btn-icon btn-delete" title="Delete Task">
                    <span class="material-symbols-outlined">delete</span>
                </button>
            </div>
        </li>


        <li class="todo-card priority-medium">
            <label class="custom-checkbox">
                <input type="checkbox">
                <span class="checkmark"></span>
            </label>
            <div class="todo-content">
                <span class="todo-title">Team Sync Meeting</span>
                <div class="todo-meta">
                    <span class="tag tag-medium">Project Alpha</span>
                    <span class="todo-time">02:30 PM</span>
                </div>
            </div>
            <div class="todo-actions">

                <button type="button" class="btn-icon btn-ai" title="Get AI Suggestions">
                    <span class="material-symbols-outlined">auto_awesome</span>
                </button>


                <button type="button" class="btn-icon btn-delete" title="Delete Task">
                    <span class="material-symbols-outlined">delete</span>
                </button>
            </div>
        </li>


        <li class="todo-card completed">
            <label class="custom-checkbox">
                <input type="checkbox" checked>
                <span class="checkmark"></span>
            </label>
            <div class="todo-content">
                <span class="todo-title">Morning Workout Routine</span>
                <div class="todo-meta">
                    <span class="todo-time">07:00 AM</span>
                </div>
            </div>
            <div class="todo-actions">

                <button type="button" class="btn-icon btn-ai" title="Get AI Suggestions">
                    <span class="material-symbols-outlined">auto_awesome</span>
                </button>


                <button type="button" class="btn-icon btn-delete" title="Delete Task">
                    <span class="material-symbols-outlined">delete</span>
                </button>
            </div>
        </li>
    </ul>
</main>

<script src="js/app.js"></script>
</body>
</html>
